<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odoo prod guard fixture</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.4 "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      background: #efeae2;
      color: #1c1915;
    }
    .shell { display: flex; min-height: 100vh; }
    .chat { flex: 1; padding: 24px; color: #6b645b; }
    .pane {
      width: 320px;
      background: #f7f4ee;
      border-left: 1px solid #ddd4c6;
      padding: 16px;
    }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; margin: 16px 0 6px; }
    .pane-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .badge { border-radius: 999px; padding: 2px 8px; font: 12px/1.4 ui-monospace, monospace; }
    .badge-prod { background: #ffedd5; color: #9a3412; }
    .badge-dev { background: #d1fae5; color: #1e3a34; }
    .muted { color: #6b645b; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 8px 0; border-top: 1px solid #e4dccf; display: flex; flex-direction: column; gap: 2px; }
    .decision { font: 12px/1.3 ui-monospace, monospace; }
    button { margin-top: 12px; font: inherit; padding: 6px 10px; }
    @media (max-width: 700px) {
      .shell { display: block; }
      .chat { display: none; }
      .pane { width: 100%; border-left: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="chat">Chat stays on the left. The guard pane is the right column.</main>
    <aside class="pane" id="pane">
      <header class="pane-head">
        <h1>Odoo prod guard</h1>
        <span class="badge badge-prod" id="badge">prod</span>
      </header>
      <h2>Environment</h2>
      <p id="env-copy">Production writes are gated.</p>
      <h2>Routine allowlist</h2>
      <ul id="allow"><li>account.move:action_post</li></ul>
      <h2>Recent gated calls</h2>
      <ul class="events" id="events"></ul>
      <button type="button" id="refresh">Refresh</button>
    </aside>
  </div>
  <script>
    const ready = [
      { decision: "approve", model: "res.partner", method: "unlink", at: "2026-11-04T18:00:00Z" },
      { decision: "allowed", model: "account.move", method: "action_post", at: "2026-11-04T18:01:00Z" }
    ]
    const params = new URLSearchParams(location.search)
    let events = params.get("state") === "before" ? [] : ready
    const host = document.getElementById("events")
    function paint() {
      host.replaceChildren()
      if (!events.length) {
        const p = document.createElement("p")
        p.className = "muted"
        p.textContent = "No gated calls yet."
        host.append(p)
        return
      }
      for (const event of events) {
        const li = document.createElement("li")
        const decision = document.createElement("span")
        decision.className = "decision"
        decision.textContent = event.decision
        const name = document.createElement("span")
        name.textContent = event.model + "." + event.method
        const at = document.createElement("span")
        at.className = "muted"
        at.textContent = event.at
        li.append(decision, name, at)
        host.append(li)
      }
    }
    paint()
    document.getElementById("refresh").addEventListener("click", () => {
      events = ready
      paint()
    })
  </script>
</body>
</html>
